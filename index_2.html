<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixie Dust Harvest</title>
<style>
  :root{
    --bg:#05060a; --ink:#f3ead2; --ink-dim:#a59f8e; --panel:rgba(20,18,14,.62);
    --line:rgba(255,228,160,.18); --gold:#ffd77a; --leaf:#b9f5a6; --root:#ffb489;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="light"]){ --bg:#05060a; }
  }
  :root[data-theme="dark"]{ --bg:#05060a; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .bar{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box}
  button{all:unset;cursor:pointer;font-size:13px;padding:7px 11px;border-radius:9px;color:var(--ink);
    border:1px solid transparent;white-space:nowrap}
  button:hover{background:rgba(255,230,170,.08)}
  button[aria-pressed="true"]{border-color:var(--line);background:rgba(255,215,122,.13);color:var(--gold)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  label.spd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);padding:0 6px}
  input[type=range]{accent-color:var(--gold);width:90px}
  .hint{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;font-size:12px;color:var(--ink-dim);
    letter-spacing:.02em;pointer-events:none}
  .hint b{color:var(--ink);font-weight:600}
  .status{position:fixed;top:max(14px,env(safe-area-inset-top));right:16px;font-size:12px;color:var(--ink-dim);
    font-variant-numeric:tabular-nums;pointer-events:none;text-align:right;line-height:1.6}
  .err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:14px}
</style>
</head>
<body>
<canvas id="c" aria-label="3D particles: roots and leaves scatter like fairy dust and gather back"></canvas>
<div class="hint"><b>Pixie Dust Harvest</b> · Drag to rotate · Scroll/pinch to zoom</div>
<div class="status" id="status"></div>
<div class="bar" role="toolbar" aria-label="Effect controls">
  <button id="play" aria-pressed="true">⏸ Pause</button>
  <div class="sep"></div>
  <button data-mode="alt" aria-pressed="true">Alternate</button>
  <button data-mode="sync" aria-pressed="false">Together</button>
  <div class="sep"></div>
  <button data-burst="0"><span class="dot" style="background:var(--root)"></span>Burst roots</button>
  <button data-burst="1"><span class="dot" style="background:var(--leaf)"></span>Burst leaves</button>
  <div class="sep"></div>
  <label class="spd">Speed <input id="speed" type="range" min="0.3" max="2" step="0.05" value="1"></label>
  <button id="reset">Reset view</button>
</div>
<div class="err" id="err">WebGL2 isn't available in this browser.</div>

<script>
(async()=>{
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2',{antialias:false,premultipliedAlpha:false,alpha:false});
if(!gl){document.getElementById('err').style.display='grid';return;}
// Two SOG files: leaves.sog and roots.sog. Splats in each file are stored object by object,
// ordered from the crown (where leaf meets root) outwards; RANGES gives [objectId, count] runs.
const FILES = [{url:'./leaves.sog', leaf:1, ranges:[[0, 83282], [3, 14644], [4, 17857]]},
               {url:'./roots.sog',  leaf:0, ranges:[[0, 20954], [1, 15804], [2, 25984], [3, 14299], [4, 11682]]}];
// table-plane frame (fitted to the scene) so the vegetables face the camera
const FRAME = {ctr:[-0.0599296800874799, -0.07116545287839092, 0.05007836469606271], a:[0.8002651215983896, 0.502392609505075, -0.3273795978184893], b:[-0.3861974815637157, 0.014163737591596892, -0.922307374887179], n:[-0.4587234901190018, 0.8645235997080225, 0.20535750573311023]};


// ---------- read SOG (zip of webp textures + meta.json) ----------
const errBox=document.getElementById('err');
async function unzip(ab){
  const dv=new DataView(ab), u8=new Uint8Array(ab), out={};
  let e=ab.byteLength-22; while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('not a zip');
  let p=dv.getUint32(e+16,true); const n=dv.getUint16(e+10,true);
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    let data=u8.slice(ds,ds+csize);
    if(method===8) data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    out[name]=data; p+=46+nl+xl+cl;
  }
  return out;
}
// decode a webp exactly (no premultiply, no colour management) by reading it back from a texture
const fbo=gl.createFramebuffer();
async function pixels(bytes){
  const bmp=await createImageBitmap(new Blob([bytes],{type:'image/webp'}),{premultiplyAlpha:'none',colorSpaceConversion:'none'});
  const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false); gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,gl.RGBA,gl.UNSIGNED_BYTE,bmp);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  const px=new Uint8Array(bmp.width*bmp.height*4); gl.readPixels(0,0,bmp.width,bmp.height,gl.RGBA,gl.UNSIGNED_BYTE,px);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.deleteTexture(tex); bmp.close();
  return px;
}
let sogs;
try{
  sogs=await Promise.all(FILES.map(async f=>{
    const r=await fetch(f.url); if(!r.ok) throw new Error(f.url+' '+r.status);
    const z=await unzip(await r.arrayBuffer()); const meta=JSON.parse(new TextDecoder().decode(z['meta.json']));
    const tex={}; for(const k of ['means_l','means_u','scales','sh0']) tex[k]=await pixels(z[k+'.webp']);
    return {f,meta,tex};
  }));
}catch(e){
  console.error(e);
  errBox.textContent="Couldn't load leaves.sog / roots.sog. Keep them in the same folder as index.html and open the page through a local server (e.g. py -m http.server 8000).";
  errBox.style.display='grid'; return;
}
const N=sogs.reduce((s,x)=>s+x.meta.count,0);
const pos=new Float32Array(N*3), col8=new Uint8Array(N*4), size8=new Uint8Array(N), flag8=new Uint8Array(N), sweep8=new Uint8Array(N);
const SH_C0=0.28209479177387814, LMIN=Math.log(2e-4), LSPAN=Math.log(2e-2)-LMIN;
let j=0;
for(const {f,meta,tex} of sogs){
  const mn=meta.means.mins, mx=meta.means.maxs, scb=meta.scales.codebook, ccb=meta.sh0.codebook;
  let i=0;
  for(const [obj,count] of f.ranges){
    for(let r=0;r<count;r++,i++,j++){
      const q=i*4, w=[0,0,0];
      for(let k=0;k<3;k++){
        let v=mn[k]+(mx[k]-mn[k])*((tex.means_u[q+k]<<8|tex.means_l[q+k])/65535);
        w[k]=Math.sign(v)*(Math.exp(Math.abs(v))-1)-FRAME.ctr[k];
      }
      pos[j*3]  =w[0]*FRAME.a[0]+w[1]*FRAME.a[1]+w[2]*FRAME.a[2];
      pos[j*3+1]=w[0]*FRAME.b[0]+w[1]*FRAME.b[1]+w[2]*FRAME.b[2];
      pos[j*3+2]=w[0]*FRAME.n[0]+w[1]*FRAME.n[1]+w[2]*FRAME.n[2];
      for(let k=0;k<3;k++) col8[j*4+k]=Math.max(0,Math.min(255,Math.round((0.5+SH_C0*ccb[tex.sh0[q+k]])*255)));
      col8[j*4+3]=tex.sh0[q+3];
      const s=[scb[tex.scales[q]],scb[tex.scales[q+1]],scb[tex.scales[q+2]]].sort((a,b)=>a-b);
      const ls=(s[1]+s[2])/2;   // log of sqrt(product of the two largest scales)
      size8[j]=Math.max(0,Math.min(255,Math.round((ls-LMIN)/LSPAN*255)));
      flag8[j]=f.leaf|(obj<<1);
      sweep8[j]=Math.round(r/Math.max(1,count-1)*255);
    }
  }
}
const lo=[1e9,1e9,1e9], hi=[-1e9,-1e9,-1e9], ctr=[0,0,0];
for(let i=0;i<N;i++) for(let k=0;k<3;k++){const v=pos[i*3+k]; if(v<lo[k])lo[k]=v; if(v>hi[k])hi[k]=v;}
// object/group centres (5 objects x 2 groups) for the swirl
const cen=new Float32Array(10*3), cnt=new Float32Array(10);
for(let i=0;i<N;i++){const g=(flag8[i]>>1)*2+(flag8[i]&1);cnt[g]++;for(let k=0;k<3;k++)cen[g*3+k]+=pos[i*3+k];}
for(let g=0;g<10;g++) if(cnt[g]) for(let k=0;k<3;k++) cen[g*3+k]/=cnt[g];
const centre=new Float32Array(N*3);
for(let i=0;i<N;i++){const g=(flag8[i]>>1)*2+(flag8[i]&1);centre.set(cen.subarray(g*3,g*3+3),i*3);}
for(let i=0;i<N;i++) for(let k=0;k<3;k++) ctr[k]+=pos[i*3+k]/N;

let leafN=0; for(let i=0;i<N;i++) leafN+=flag8[i]&1;
document.getElementById('status').innerHTML =
  `5 objects · ${N.toLocaleString('en-US')} particles<br>Leaves ${leafN.toLocaleString('en-US')} · Roots ${(N-leafN).toLocaleString('en-US')}`;

// ---------- shaders ----------
const VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec4 aCol;
layout(location=2) in float aSize;
layout(location=3) in float aFlag;
layout(location=4) in float aSweep;
layout(location=5) in vec3 aCen;
uniform mat4 uView, uProj;
uniform float uTime, uViewportH, uFocal, uPass;
uniform vec2 uPhase;     // cycle phase for roots(x) / leaves(y), 0..1
uniform vec2 uKick;      // manual burst override per group (0..1)
out vec4 vCol; out float vGlow; out float vTw;

float h(float n){ return fract(sin(n*12.9898)*43758.5453); }
float easeOut(float x){ x=clamp(x,0.,1.); return 1.-pow(1.-x,3.); }
float easeInOut(float x){ x=clamp(x,0.,1.); return x<.5?4.*x*x*x:1.-pow(-2.*x+2.,3.)/2.; }

// scatter amount over one normalised cycle
float scatterAt(float s){
  s=fract(s);
  if(s<.22) return 0.;
  if(s<.40) return easeOut((s-.22)/.18);
  if(s<.56) return 1.;
  if(s<.86) return 1.-easeInOut((s-.56)/.30);
  return 0.;
}
void main(){
  float id=float(gl_VertexID);
  float r1=h(id+.13), r2=h(id*1.71+3.1), r3=h(id*.37+7.7), r4=h(id*2.9+1.3);
  float isLeaf = mod(aFlag,2.);
  float obj = floor(aFlag/2.);
  float ph = mix(uPhase.x,uPhase.y,isLeaf);
  // tips go first, crowns regrow first: delay by sweep
  float delay = (aSweep/255.)*.11 + r1*.035;
  float k = max(scatterAt(ph - .11 + delay), mix(uKick.x,uKick.y,isLeaf));

  // outward direction: radial from object centre + lift toward viewer, randomised
  vec3 rel = aPos - aCen;
  vec3 rnd = normalize(vec3(r2-.5, r3-.5, r4-.5)+1e-4);
  vec3 dir = normalize(normalize(rel+1e-4)*.9 + rnd*1.1 + vec3(0.,.06,.4));
  float mag = mix(.035,.22,pow(r3,1.8)) * (isLeaf>.5?1.1:.9);
  vec3 p = aPos + dir*mag*k;

  // swirl around the group centre (spins one way out, carries on as it gathers)
  float spin = (mod(obj,2.)<.5?1.:-1.) * (isLeaf>.5?1.:-1.) * (1.1 + r1*.9);
  float ang = spin*k*(.8+.6*sin(uTime*.35+obj));
  vec2 q = p.xy - aCen.xy; float ca=cos(ang), sa=sin(ang);
  p.xy = aCen.xy + vec2(ca*q.x-sa*q.y, sa*q.x+ca*q.y);
  // fairy-dust float: drifting, gentle bob
  vec3 drift = vec3(sin(uTime*.9+r2*40.), cos(uTime*.7+r3*40.), sin(uTime*1.1+r4*40.))*.035;
  p += drift*k + vec3(0., .03, .05)*k*sin(uTime*1.6+r1*6.283);

  vec4 vp = uView*vec4(p,1.);
  gl_Position = uProj*vp;
  float dist = max(-vp.z,.05);

  // twinkle
  float tw = pow(.5+.5*sin(uTime*(3.+r4*9.)+r2*60.), 10.);
  vTw = tw;
  float base = .0002*exp(aSize/255.*log(100.));   // decoded splat sigma
  float px = base*3.2*uFocal*uViewportH/dist;
  vec3 c = aCol.rgb;
  if(uPass<.5){
    // body: original colours, fading into dust
    px = max(px,1.6) * mix(1.,.45,k);
    vCol = vec4(c, aCol.a * (1.-smoothstep(.05,.85,k)));
    vGlow = 0.;
  }else{
    // sparkle: gold dust tinted by the source colour
    vec3 dust = isLeaf>.5 ? vec3(.62,1.,.45) : vec3(1.,.62,.32);
    vec3 gold = vec3(1.,.80,.38);
    vec3 sc = mix(mix(gold,dust,.45+.4*r2), c*1.4, .3);
    sc = mix(sc, vec3(1.,.95,.8), tw*.25);   // hot white flash at the twinkle peak
    float keep = step(r1, .42);              // a little over half the particles carry a spark
    float a = keep * smoothstep(.0,.35,k) * (.07 + .93*tw);
    float big = step(.93, r4);                // a few large star-glints
    px = mix(1.3, mix(4.,9.,big), tw) * (uViewportH/900.) * (.8+.5*r3);
    vCol = vec4(sc, a);
    vGlow = 1.;
  }
  gl_PointSize = clamp(px, 1., 48.);
}`;
const FS = `#version 300 es
precision highp float;
in vec4 vCol; in float vGlow; in float vTw;
out vec4 o;
void main(){
  vec2 d = gl_PointCoord*2.-1.; float r2 = dot(d,d);
  if(r2>1.) discard;
  float a;
  if(vGlow<.5){ a = exp(-r2*4.); }
  else{
    float core = exp(-r2*14.);
    float halo = exp(-r2*3.5)*.35;
    float star = max(0., 1.-abs(d.x)*9.)*max(0.,1.-abs(d.y)*1.1) + max(0.,1.-abs(d.y)*9.)*max(0.,1.-abs(d.x)*1.1);
    a = core + halo + star*.55*vTw;
  }
  o = vec4(vCol.rgb*(vGlow>.5?1.+vTw*.5:1.), vCol.a*a);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
const U={}; for(const n of ['uView','uProj','uTime','uViewportH','uFocal','uPass','uPhase','uKick']) U[n]=gl.getUniformLocation(prog,n);

const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
function attr(loc,data,size,type,norm){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,type,norm,0,0);}
attr(0,pos,3,gl.FLOAT,false);
attr(1,col8,4,gl.UNSIGNED_BYTE,true);
attr(2,size8,1,gl.UNSIGNED_BYTE,false);
attr(3,flag8,1,gl.UNSIGNED_BYTE,false);
attr(4,sweep8,1,gl.UNSIGNED_BYTE,false);
attr(5,centre,3,gl.FLOAT,false);

// ---------- camera ----------
const FOV=38*Math.PI/180, focal=1/Math.tan(FOV/2)/2;
const span=Math.max(hi[0]-lo[0],hi[1]-lo[1]);
const home={yaw:0,pitch:-0.12,dist:span*1.3/ (2*Math.tan(FOV/2)) * 1.0};
let cam={...home}, target=[ctr[0],ctr[1],ctr[2]];
function persp(f,a,n,fa){const t=1/Math.tan(f/2);return new Float32Array([t/a,0,0,0, 0,t,0,0, 0,0,(fa+n)/(n-fa),-1, 0,0,2*fa*n/(n-fa),0]);}
function lookAt(e,c,u){let z=[e[0]-c[0],e[1]-c[1],e[2]-c[2]];let l=Math.hypot(...z);z=z.map(v=>v/l);
  let x=[u[1]*z[2]-u[2]*z[1],u[2]*z[0]-u[0]*z[2],u[0]*z[1]-u[1]*z[0]];l=Math.hypot(...x);x=x.map(v=>v/l);
  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]), -(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]), -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]),1]);}

// orbit input
const ptrs=new Map(); let pinch0=0, dist0=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dist0=cam.dist;}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){cam.yaw-= (e.clientX-p.x)*.006; cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch+(e.clientY-p.y)*.006));}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)cam.dist=Math.max(.3,Math.min(8,dist0*pinch0/d));}});
const up=e=>{ptrs.delete(e.pointerId);pinch0=0;};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.dist=Math.max(.3,Math.min(8,cam.dist*Math.exp(e.deltaY*.001)));},{passive:false});

// ---------- UI ----------
let playing=true, mode='alt', speed=1, t=0, last=performance.now();
const kick=[0,0], kickT=[-1,-1];
const playBtn=document.getElementById('play');
playBtn.onclick=()=>{playing=!playing;playBtn.setAttribute('aria-pressed',playing);playBtn.textContent=playing?'⏸ Pause':'▶ Play';};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
document.querySelectorAll('[data-burst]').forEach(b=>b.onclick=()=>{kickT[+b.dataset.burst]=0;});
document.getElementById('speed').oninput=e=>speed=+e.target.value;
document.getElementById('reset').onclick=()=>{cam={...home};};

function resize(){const dpr=Math.min(devicePixelRatio||1,2);const w=innerWidth*dpr|0,h=innerHeight*dpr|0;
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
const CYCLE=9.0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(playing) t+=dt*speed;
  for(let g=0;g<2;g++){ if(kickT[g]>=0){ kickT[g]+=dt*speed; const x=kickT[g];
      kick[g]= x<.6? 1-Math.pow(1-x/.6,3) : x<1.6? 1 : x<3.4? 1-((y=>y<.5?4*y*y*y:1-Math.pow(-2*y+2,3)/2)((x-1.6)/1.8)) : 0;
      if(x>=3.4){kickT[g]=-1;kick[g]=0;} } }
  resize(); gl.viewport(0,0,canvas.width,canvas.height);
  const bg=[5/255,6/255,10/255]; gl.clearColor(bg[0],bg[1],bg[2],1); gl.clear(gl.COLOR_BUFFER_BIT);
  const cp=Math.cos(cam.pitch);
  const eye=[target[0]+cam.dist*cp*Math.sin(cam.yaw), target[1]-cam.dist*Math.sin(cam.pitch), target[2]+cam.dist*cp*Math.cos(cam.yaw)];
  gl.useProgram(prog); gl.bindVertexArray(vao);
  gl.uniformMatrix4fv(U.uView,false,lookAt(eye,target,[0,1,0]));
  gl.uniformMatrix4fv(U.uProj,false,persp(FOV,canvas.width/canvas.height,.01,50));
  gl.uniform1f(U.uTime,t); gl.uniform1f(U.uViewportH,canvas.height); gl.uniform1f(U.uFocal,focal);
  const ph=t/CYCLE; gl.uniform2f(U.uPhase, ph+(mode==='alt'?.5:0), ph);
  gl.uniform2f(U.uKick,kick[0],kick[1]);
  gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.uniform1f(U.uPass,0); gl.drawArrays(gl.POINTS,0,N);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  gl.uniform1f(U.uPass,1); gl.drawArrays(gl.POINTS,0,N);
  requestAnimationFrame(frame);
}
window.__setTime=v=>{t=v;playing=false;};
requestAnimationFrame(frame);
})();
